openapi: 3.0.0
info:
    title: Hockey Tracker Api
    description: Api to retrieve and update hockey statistics for rec teams
    version: 0.0.1

servers:
    - url: http://localhost:3000/api/v2
      description: local dev

paths:
    /liveness:
        get:
            summary: Health Check
            description: Checks if the application is up and running
            responses:
                '200':
                    description: OK
                    content:
                        text/plain:
                            schema:
                                type: string
                                example: We are live baby!

    /seasons:
        get:
            summary: Hockey Seasons
            description: Gets a list of all Seasons
            responses:
                '200':
                    description: A list of seasons
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Season'
                '403':
                    description: Unauthorised
                '500':
                    description: Server error

    /player:
        post:
            summary: Create a new player
            description: Creates a new player based on a first name and surname that was passed in
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - firstName
                                - surname
                            properties:
                                firstName:
                                    type: string
                                    example: John
                                surname:
                                    type: string
                                    example: Doe
            responses:
                '201':
                    description: Player created successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Player'
                '403':
                    description: Unauthorised
                '500':
                    description: Server error

        get:
            summary: Get all players
            description: Retrieves a list of all players
            responses:
                '200':
                    description: A list of players
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Player'
                '404':
                    description: No players found
                '403':
                    description: Unauthorised
                '500':
                    description: Server error

    /player/{playerId}:
        get:
            summary: Get player by ID
            description: Retrieves a player by their unique playerId
            parameters:
                - name: playerId
                  in: path
                  required: true
                  description: Unique Player ID in the format PLR followed by 6 digits (e.g., PLR123456)
                  schema:
                      type: string
                      pattern: '^PLR\d{6}$'
                      example: PLR123456
            responses:
                '200':
                    description: Player found successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Player'
                '400':
                    description: Invalid playerId format
                '404':
                    description: Player not found
                '403':
                    description: Unauthorised
                '500':
                    description: Server error

        delete:
            summary: Delete player by ID
            description: Deletes a player using their unique playerId
            parameters:
                - name: playerId
                  in: path
                  required: true
                  description: Unique Player ID in the format PLR followed by 6 digits (e.g., PLR123456)
                  schema:
                      type: string
                      pattern: '^PLR\d{6}$'
                      example: PLR123456
            responses:
                '204':
                    description: Player deleted successfully (no content)
                '400':
                    description: Invalid playerId format
                '404':
                    description: Player not found
                '403':
                    description: Unauthorised
                '500':
                    description: Server error

    /player/{playerId}/details:
        patch:
            summary: Update player details
            description: Updates a player's first name and surname using their unique playerId
            parameters:
                - name: playerId
                  in: path
                  required: true
                  description: Unique Player ID in the format PLR followed by 6 digits (e.g., PLR123456)
                  schema:
                      type: string
                      pattern: '^PLR\d{6}$'
                      example: PLR123456
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - firstName
                                - surname
                            properties:
                                firstName:
                                    type: string
                                    example: John
                                surname:
                                    type: string
                                    example: Doe
            responses:
                '204':
                    description: Player updated successfully (no content)
                '304':
                    description: Player not modified
                '400':
                    description: Invalid playerId format or request body
                '403':
                    description: Unauthorised
                '500':
                    description: Server error

    /team:
        post:
            summary: Create a new team
            description: Creates a new team with the provided name
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - name
                            properties:
                                name:
                                    type: string
                                    example: 'Peterborough Warriors'
            responses:
                '201':
                    description: Team created successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Team'
                '400':
                    description: Invalid team name format
                '403':
                    description: Unauthorised
                '500':
                    description: Server error
        get:
            tags:
                - Teams
            summary: Get all teams
            description: Returns an array of all teams in the system
            responses:
                '200':
                    description: Successfully retrieved teams
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Team'
                '401':
                    description: Unauthorized - Invalid or missing API key
                '404':
                    description: No teams found
                '500':
                    description: Internal server error

    /team/addplayer/{teamId}:
        patch:
            summary: Add player to team
            description: Adds a player to a team with the specified player number
            parameters:
                - name: teamId
                  in: path
                  required: true
                  description: Unique Team ID
                  schema:
                      type: string
                      example: TM123456
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - playerId
                                - number
                            properties:
                                playerId:
                                    type: string
                                    pattern: '^PLR\d{6}$'
                                    example: PLR123456
                                number:
                                    type: number
                                    example: 99
            responses:
                '200':
                    description: Player added to team successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Team'
                '400':
                    description: Invalid request body or team/player ID format
                '403':
                    description: Unauthorised
                '404':
                    description: Team or player not found
                '500':
                    description: Server error

    /team/removeplayer/{teamId}:
        patch:
            summary: Remove player from team
            description: Removes a player from a team
            parameters:
                - name: teamId
                  in: path
                  required: true
                  description: Unique Team ID
                  schema:
                      type: string
                      example: TM123456
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - playerId
                            properties:
                                playerId:
                                    type: string
                                    pattern: '^PLR\d{6}$'
                                    example: PLR123456
            responses:
                '204':
                    description: Player removed from team successfully (no content)
                '400':
                    description: Invalid request body or player ID format
                '403':
                    description: Unauthorised
                '404':
                    description: Team or player not found
                '500':
                    description: Server error

    /game:
        post:
            summary: Create a new game
            description: Creates a new game with the provided details
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/GamePostBody'
            responses:
                '201':
                    description: Game created successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Game'
                '400':
                    description: Invalid request body
                '403':
                    description: Unauthorised
                '500':
                    description: Server error

components:
    schemas:
        Season:
            type: object
            properties:
                id:
                    type: string
                    example: 'SSN100'
                name:
                    type: string
                    example: '23/24'
            required:
                - id
                - name

        Player:
            type: object
            properties:
                _id:
                    type: string
                    example: 'PLR127841'
                firstName:
                    type: string
                    example: 'John'
                surname:
                    type: string
                    example: 'Doe'
                teams:
                    type: array
                    items:
                        $ref: '#/components/schemas/PlayerTeamDetails'
                stats:
                    type: array
                    items:
                        $ref: '#/components/schemas/PlayerStats'
            required:
                - _id
                - firstName
                - surname
                - teams
                - stats

        PlayerTeamDetails:
            type: object
            properties:
                teamId:
                    type: string
                    example: 'TM123456'
                number:
                    type: number
                    example: 99
            required:
                - teamId
                - number

        PlayerStats:
            type: object
            properties:
                seasonId:
                    type: string
                    example: 'SSN100'
                gamesPlayed:
                    type: number
                    example: 10
                goals:
                    type: number
                    example: 5
                assists:
                    type: number
                    example: 8
                pims:
                    type: number
                    example: 2
            required:
                - seasonId
                - gamesPlayed
                - goals
                - assists
                - pims

        Team:
            type: object
            properties:
                _id:
                    type: string
                    example: 'TM123456'
                name:
                    type: string
                    example: 'Peterborough Warriors'
                players:
                    type: array
                    items:
                        $ref: '#/components/schemas/TeamPlayerDetails'
            required:
                - _id
                - name
                - players

        TeamPlayerDetails:
            type: object
            properties:
                playerId:
                    type: string
                    example: 'PLR123456'
                number:
                    type: number
                    example: 99
                stats:
                    type: array
                    items:
                        $ref: '#/components/schemas/PlayerStats'
            required:
                - playerId
                - number
                - stats

        GamePostBody:
            type: object
            properties:
                date:
                    type: string
                    format: date-time
                    description: Date in ISO format
                    example: '2024-01-15T19:00:00.000Z'
                team:
                    type: string
                    description: Team ID
                    example: 'TM123456'
                teamRoster:
                    type: array
                    items:
                        type: string
                        pattern: '^PLR\d{6}$'
                    description: Array of player IDs on the roster
                    example: ['PLR123456', 'PLR789012']
                opponentName:
                    type: string
                    description: Name of the opponent team
                    example: 'Toronto Maple Leafs'
                seasonId:
                    type: string
                    description: Season ID
                    example: 'SSN100'
            required:
                - date
                - team
                - teamRoster
                - opponentName
                - seasonId

        Game:
            type: object
            properties:
                _id:
                    type: string
                    example: 'GM123456'
                date:
                    type: string
                    format: date-time
                    example: '2024-01-15T19:00:00.000Z'
                team:
                    $ref: '#/components/schemas/TeamGameTeam'
                opponentTeam:
                    $ref: '#/components/schemas/OpponentGameTeam'
                score:
                    $ref: '#/components/schemas/GameScore'
            required:
                - _id
                - date
                - team
                - opponentTeam
                - score

        TeamGameTeam:
            type: object
            properties:
                id:
                    type: string
                    example: 'TM123456'
                roster:
                    type: array
                    items:
                        $ref: '#/components/schemas/GamePlayer'
                goals:
                    type: array
                    items:
                        $ref: '#/components/schemas/GameTeamGoals'
                penalties:
                    type: array
                    items:
                        $ref: '#/components/schemas/GameTeamPenalty'
            required:
                - id
                - roster
                - goals
                - penalties

        OpponentGameTeam:
            type: object
            properties:
                name:
                    type: string
                    example: 'Toronto Maple Leafs'
                goals:
                    type: array
                    items:
                        $ref: '#/components/schemas/GameOpponentGoals'
                penalties:
                    type: array
                    items:
                        $ref: '#/components/schemas/GameOpponentPenalty'
            required:
                - name
                - goals
                - penalties

        GamePlayer:
            type: object
            properties:
                playerId:
                    type: string
                    example: 'PLR123456'
                teamId:
                    type: string
                    example: 'TM123456'
                stats:
                    $ref: '#/components/schemas/GamePlayerStats'
            required:
                - playerId
                - teamId
                - stats

        GamePlayerStats:
            type: object
            properties:
                goals:
                    type: number
                    example: 1
                assists:
                    type: number
                    example: 2
                pims:
                    type: number
                    example: 0
            required:
                - goals
                - assists
                - pims

        GameTeamGoals:
            type: object
            allOf:
                - $ref: '#/components/schemas/BaseGameStat'
                - type: object
                  properties:
                      scoredBy:
                          type: string
                          description: Player ID who scored
                          example: 'PLR123456'
                      assist1:
                          type: string
                          description: Player ID of first assist
                          example: 'PLR789012'
                      assist2:
                          type: string
                          description: Player ID of second assist
                          example: 'PLR345678'
                      type:
                          $ref: '#/components/schemas/GoalType'
                  required:
                      - scoredBy
                      - assist1
                      - assist2
                      - type

        GameOpponentGoals:
            type: object
            allOf:
                - $ref: '#/components/schemas/BaseGameStat'
                - type: object
                  properties:
                      name:
                          type: string
                          description: Name of player who scored
                          example: 'John Doe'
                      type:
                          $ref: '#/components/schemas/GoalType'
                  required:
                      - name
                      - type

        GameTeamPenalty:
            type: object
            allOf:
                - $ref: '#/components/schemas/BaseGameStat'
                - type: object
                  properties:
                      playerId:
                          type: string
                          example: 'PLR123456'
                      type:
                          $ref: '#/components/schemas/PenaltyType'
                      duration:
                          type: number
                          description: Duration in minutes
                          example: 2
                  required:
                      - playerId
                      - type
                      - duration

        GameOpponentPenalty:
            type: object
            allOf:
                - $ref: '#/components/schemas/BaseGameStat'
                - type: object
                  properties:
                      name:
                          type: string
                          description: Name of player
                          example: 'John Doe'
                      type:
                          $ref: '#/components/schemas/PenaltyType'
                      duration:
                          type: number
                          description: Duration in minutes
                          example: 2
                  required:
                      - name
                      - type
                      - duration

        BaseGameStat:
            type: object
            properties:
                minute:
                    type: number
                    example: 15
                second:
                    type: number
                    example: 30
            required:
                - minute
                - second

        GameScore:
            type: object
            properties:
                team:
                    type: number
                    example: 3
                opponent:
                    type: number
                    example: 2
                periods:
                    type: array
                    items:
                        $ref: '#/components/schemas/GamePeriodScore'
            required:
                - team
                - opponent
                - periods

        GamePeriodScore:
            type: object
            properties:
                number:
                    type: number
                    example: 1
                team:
                    type: number
                    example: 1
                opponent:
                    type: number
                    example: 0
            required:
                - number
                - team
                - opponent

        GoalType:
            type: string
            enum: [EVEN, SH, PP]
            description: |
                Goal types:
                - EVEN: Even strength
                - SH: Short handed
                - PP: Power play

        PenaltyType:
            type: string
            enum: 
                - ABUSE
                - AGGR
                - BDYCH
                - BOARD
                - CHARG
                - CHECK
                - CHEB
                - DELAY
                - ELBOW
                - EMBEL
                - FIGHT
                - GOALINTRF
                - HIST
                - HOLD
                - HOST
                - HOOK
                - ILLEQUIP
                - INTRF
                - KICK
                - KNEE
                - MATCH
                - MISC
                - RETAL
                - ROUGH
                - SLASH
                - SPEAR
                - THROWSTICK
                - TOOM
                - TRIP
                - UNSP
            description: |
                Penalty types:
                - ABUSE: Abuse of officials
                - AGGR: Aggressor penalty
                - BDYCH: Body checking
                - BOARD: Boarding
                - CHARG: Charging
                - CHECK: Checking
                - CHEB: Checking from behind
                - DELAY: Delay of game
                - ELBOW: Elbowing
                - EMBEL: Embellishment
                - FIGHT: Fighting
                - GOALINTRF: Goaltender interference
                - HIST: High sticking
                - HOLD: Holding
                - HOST: Holding the stick
                - HOOK: Hooking
                - ILLEQUIP: Illegal equipment
                - INTRF: Interference
                - KICK: Kicking
                - KNEE: Kneeing
                - MATCH: Match penalty (e.g. intent to injure)
                - MISC: Misconduct
                - RETAL: Retaliation
                - ROUGH: Roughing
                - SLASH: Slashing
                - SPEAR: Spearing
                - THROWSTICK: Throwing the stick
                - TOOM: Too many men on the ice
                - TRIP: Tripping
                - UNSP: Unsportsmanlike conduct
